spring.application.name=ItalianPracticeBackend

spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
app.env=${APP_ENV:development}

spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/italian_practice_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.access-secret=${JWT_ACCESS_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET:7A24432646294A404E635266556A586E3272357538782F413F4428472B4B6250}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:604800000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}